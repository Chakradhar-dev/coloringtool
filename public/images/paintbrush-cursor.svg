<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Wooden Handle -->
    <path d="M21,3 L29,11 L27,13 L19,5 Z" fill="#D97706" stroke="#78350F" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Metal Ferrule -->
    <path d="M16,8 L23,15 L19,19 L12,12 Z" fill="#E2E8F0" stroke="#475569" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Ferrule Bands -->
    <line x1="14.5" y1="13.5" x2="20.5" y2="17.5" stroke="#94A3B8" stroke-width="0.8"/>
    <!-- Bristles -->
    <path d="M12,12 L19,19 L11,25 C7,29 2,30 2,30 C2,30 3,25 7,21 Z" fill="#FF3B30" stroke="#0F172A" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Paint Highlight Curve -->
    <path d="M13,15 L9,21 C7,23 5,26 4,28" stroke="rgba(255,255,255,0.75)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Bristle Tip Dot (Hotspot at 2, 30) -->
    <circle cx="2" cy="30" r="1.8" fill="#FF3B30" stroke="#FFFFFF" stroke-width="0.8"/>
  </g>
</svg>
